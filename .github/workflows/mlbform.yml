name: MLB form
# Starters' last five starts and each club's last ten games of F5 runs, from
# statsapi -- unreachable from the maintaining session, free from the runner.
on:
  workflow_dispatch: {}
  push: { paths: ['experiments/MLBFORM.txt'] }
permissions: { contents: write }
concurrency: { group: parlay-mlbform, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          set -o pipefail
          python3 mlbform.py --selftest | tail -2
          python3 mlbform.py 2>&1 | tee mlbform.txt
      - if: always()
        run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add mlbform.json mlbform.txt 2>/dev/null || git add mlbform.txt
          git diff --cached --quiet && exit 0
          for a in 1 2 3 4 5; do
            git commit -m "mlb form $(date -u +%F\ %H:%M)" || true
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase origin/main || git rebase --abort
          done
