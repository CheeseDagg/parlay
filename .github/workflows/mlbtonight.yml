name: MLB tonight prices
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ['experiments/MLBTONIGHT.txt'] }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 experiments/mlbtonight.py 2>&1 | tee mlbtonight.txt
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
      - if: always()
        run: |
          git config user.name "parlay-bot"; git config user.email "actions@github.com"
          cp mlbtonight.txt /tmp/mt.txt
          for a in 1 2 3; do
            git fetch origin main; git reset --hard origin/main; cp /tmp/mt.txt mlbtonight.txt
            git add mlbtonight.txt
            git diff --cached --quiet && { echo unchanged; exit 0; }
            git commit -m "mlb tonight $(date -u '+%H:%M')"
            git push origin HEAD:main && exit 0
          done
          exit 1
