name: Data source probe
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ['experiments/SRCPROBE.txt'] }
# branches: [main] + rebuild-on-fresh-main publish, same as the other runners
# (8/19: a rebase loop threw away a finished build and still exited 0).
permissions: { contents: write }
concurrency: { group: parlay-srcprobe, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          python3 srcprobe.py 2>&1 | tee srcprobe.new
          test -s srcprobe.new
          mv srcprobe.new srcprobe.txt
      - run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          mkdir -p /tmp/pub && cp srcprobe.txt /tmp/pub/
          for a in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pub/srcprobe.txt .
            git add srcprobe.txt
            git diff --cached --quiet && exit 0
            git commit -m "source probe $(date -u +%F\ %H:%M)"
            git push origin HEAD:main && exit 0
          done
          exit 1
