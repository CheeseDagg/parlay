name: Soccer catalog probe
# Answers "does this API carry the matches FanDuel is showing tonight" without
# rebuilding the board. Runs socdiag.py and commits its output so the session
# that maintains this repo -- which has no egress to the odds API -- can read it.
on:
  workflow_dispatch: {}
  push:
    paths: ['experiments/SOCDIAG.txt']
permissions:
  contents: write
concurrency:
  group: parlay-socdiag
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 socdiag.py 2>&1 | tee socdiag.txt
      - name: Publish
        if: always()
        run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add socdiag.txt
          git diff --cached --quiet && echo "no change" && exit 0
          for attempt in 1 2 3 4 5; do
            git commit -m "soccer catalog probe $(date -u +%F\ %H:%M)" || true
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase origin/main || git rebase --abort
          done
          exit 1
