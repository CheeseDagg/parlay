name: Net reachability probe
on:
  workflow_dispatch: {}
  push:
    paths: ['experiments/NETHUNT.txt']
permissions: { contents: write }
concurrency: { group: parlay-nethunt, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 nethunt.py 2>&1 | tee nethunt.txt
      - if: always()
        run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add nethunt.txt
          git diff --cached --quiet && exit 0
          for a in 1 2 3 4 5; do
            git commit -m "net probe $(date -u +%F\ %H:%M)" || true
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase origin/main || git rebase --abort
          done
          exit 1
