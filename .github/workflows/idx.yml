name: openfootball index
on: { workflow_dispatch: {}, push: { paths: ['experiments/IDX.txt'] } }
permissions: { contents: write }
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 idx.py 2>&1 | tee idx.txt
      - if: always()
        run: |
          git config user.name "parlay-bot"; git config user.email "parlay-bot@users.noreply.github.com"
          git add idx.txt; git diff --cached --quiet && exit 0
          for a in 1 2 3; do git commit -m "openfootball index" || true; git push origin HEAD:main && exit 0; git fetch origin main && git rebase origin/main || git rebase --abort; done
