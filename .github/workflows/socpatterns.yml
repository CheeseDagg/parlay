name: Soccer patterns
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ['experiments/SOCPATTERNS.txt', 'socextra.json'] }
permissions: { contents: write }
concurrency: { group: parlay-socpatterns, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          set -o pipefail
          python3 socpatterns.py --selftest | tail -2
          python3 socpatterns.py 2>&1 | tee socpatterns.new
          test -s socpatterns.new
          mv socpatterns.new socpatterns.txt
      - run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          mkdir -p /tmp/pub && cp socpatterns.txt socpatterns.json /tmp/pub/
          for a in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pub/socpatterns.txt /tmp/pub/socpatterns.json .
            git add socpatterns.txt socpatterns.json
            git diff --cached --quiet && exit 0
            git commit -m "soccer patterns $(date -u +%F\ %H:%M)"
            git push origin HEAD:main && exit 0
          done
          exit 1
