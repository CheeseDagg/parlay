name: Parlay board refresh
on:
  # ON HOLD 2026-08-17 (Ryan: "put anything gambling related on hold for now").
  # The three daily cron pulls are disabled; workflow_dispatch and the
  # REBUILD.txt touch still work for whenever the hold lifts. Schedule was:
  #   - cron: "0 16 * * *"   # noon ET slate pull
  #   - cron: "0 21 * * *"   # ~5pm ET line moves
  #   - cron: "30 23 * * *"  # 6:30pm CT last look
  workflow_dispatch: {}
  push:
    paths: ['experiments/REBUILD.txt']   # touch to refresh on demand, same as the other repos
permissions:
  contents: write
concurrency:
  group: parlay-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        # numpy for the solvers, scipy for board.py's power de-vig (brentq).
        # scipy's absence failed the first two runs AFTER a perfect pull —
        # the fetch worked, the final board selftest couldn't import.
        run: |
          set -o pipefail
          pip install numpy scipy 2>&1 | tail -2 | tee -a /tmp/refresh.log
      - name: Selftest the generators before trusting them with the board
        run: |
          set -o pipefail
          python3 pull_feeds.py --selftest 2>&1 | tee -a /tmp/refresh.log
      - name: Pull the board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          python3 pull_feeds.py 2>&1 | tee -a /tmp/refresh.log
      - name: Board + slips selftests against the fresh feeds
        run: |
          set -o pipefail
          python3 board.py --selftest 2>&1 | tee -a /tmp/refresh.log
          python3 slips.py --selftest 2>&1 | tee -a /tmp/refresh.log
      - name: Write BOARD.md
        run: |
          set -o pipefail
          python3 daily_report.py 2>&1 | tee -a /tmp/refresh.log
      # SCORES. Every stats host is blocked from the session that maintains this
      # repo, so with a slip live on 8/12 the honest answer to "is it dead?" was
      # "I cannot see" -- the board could say what to bet and not whether it won.
      # This runner has open egress, so the fetch happens here and the result is
      # committed where anything can read it. Fail-soft on purpose: a scoreboard
      # outage must never cost the board its refresh.
      # FORM RIDES WITH EVERY REFRESH. The board is repriced twice a day; form
      # that only updates when someone remembers to touch a trigger file is
      # exactly the stale-slate failure that blinded rule 25. Fail-soft, same
      # contract as scores: a form outage must never cost the board itself.
      - name: MLB form (starters + team F5)
        if: always()
        continue-on-error: true
        run: python3 mlbform.py 2>&1 | tail -15 | tee -a /tmp/refresh.log
      - name: Soccer team form
        if: always()
        continue-on-error: true
        run: python3 socform.py 2>&1 | tail -25 | tee -a /tmp/refresh.log
      # POSTED-LINE LEDGER. Nobody sells MLB line history (srcprobe round 3:
      # the one free archive is an affiliate shell now), so every refresh
      # snapshots the board's own alt-total rungs; last pregame look wins,
      # started games never overwrite. A season of this makes f5hist's rung
      # table conditionable on the posted line.
      - name: Log posted MLB lines
        if: always()
        continue-on-error: true
        run: python3 linelog.py 2>&1 | tail -3 | tee -a /tmp/refresh.log
      - name: Pull scores
        if: always()
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scores.py --selftest 2>&1 | tail -2 | tee -a /tmp/refresh.log
          python3 scores.py 2>&1 | tee -a /tmp/refresh.log
      # ALWAYS publish the run log, success or failure. The Actions log UI is
      # unreadable from the session that maintains this repo, and three failed
      # runs in a row each cost a human screenshot round-trip to diagnose. A
      # failed run commits ONLY refresh.log — the feed files it wrote are
      # reverted first, because an unverified board must never publish.
      - name: Publish run log (and the board, if everything passed)
        if: always()
        run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          # SCORES SURVIVE A BAD BOARD. The revert below exists so an unverified
          # board never publishes, and it wiped scores.json too -- so on 8/13 the
          # first successful scores pull was thrown away by a board selftest
          # failure that had nothing to do with it. Results are not a board:
          # they are what already happened, they cannot be made wrong by a bad
          # feed, and they are most wanted on exactly the nights something breaks.
          cp scores.json /tmp/scores.json 2>/dev/null || true
          if [ "${{ job.status }}" != "success" ]; then
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            cp /tmp/scores.json scores.json 2>/dev/null || true
          fi
          cp /tmp/refresh.log refresh.log 2>/dev/null || echo "(no log captured — failed before the first step wrote)" > refresh.log
          echo "run conclusion: ${{ job.status }} at $(date -u +%F\ %H:%M)" >> refresh.log
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "board refresh $(date -u +%F\ %H:%M) [${{ job.status }}]"
          # RETRY THE PUSH. This was a bare `git push` until 8/13, when a clean
          # pull -- 45 leagues, 1223 lines, the whole point of the run -- was
          # thrown away because scores-only.yml committed to main in the same
          # minute and this push was rejected as non-fast-forward. Two workflows
          # both push to main and are both triggered by pushes to main, so the
          # race is routine, not exotic; scores-only has carried this exact loop
          # since it was written. Rebase rather than merge: the board files are
          # generated wholesale, so there is nothing to reconcile, and scores
          # are written by the other job alone.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt) -- rebasing onto origin/main"
            git fetch origin main && git rebase origin/main || git rebase --abort
          done
          exit 1
