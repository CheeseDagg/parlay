name: Parlay board refresh
on:
  schedule:
    # 16:00 UTC = noon ET: MLB slates and props are posted, nothing has started.
    # A second pull at 21:00 UTC (~5pm ET) catches line moves before first pitch.
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}
  push:
    paths: ['experiments/REBUILD.txt']   # touch to refresh on demand, same as the other repos
permissions:
  contents: write
concurrency:
  group: parlay-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: pip install numpy
      - name: Selftest the generators before trusting them with the board
        run: python3 pull_feeds.py --selftest
      - name: Pull the board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 pull_feeds.py
      - name: Board + slips selftests against the fresh feeds
        run: |
          python3 board.py --selftest
          python3 slips.py --selftest
      - name: Write BOARD.md
        run: python3 daily_report.py
      - name: Commit if anything changed
        run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "board refresh $(date -u +%F\ %H:%M)"
          git push
