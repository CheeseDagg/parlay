name: BTTS prices
# Per-event odds cost one credit each, so this never runs on a schedule --
# touch experiments/BTTS.txt when the question is actually being asked.
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ['experiments/BTTS.txt'] }
permissions: { contents: write }
concurrency: { group: parlay-btts, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          python3 btts.py --selftest | tail -2
          python3 btts.py 2>&1 | tee btts.new
          test -s btts.new
          mv btts.new btts.txt
      - run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          mkdir -p /tmp/pub
          cp btts.txt btts.json /tmp/pub/
          for a in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pub/btts.txt /tmp/pub/btts.json .
            git add btts.txt btts.json
            git diff --cached --quiet && exit 0
            git commit -m "btts prices $(date -u +%F\ %H:%M)"
            git push origin HEAD:main && exit 0
          done
          exit 1
