name: Ticket price
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ['experiments/TICKET.txt'] }
permissions: { contents: write }
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 ticket.py --selftest
      - run: python3 ticket.py 2>&1 | tee ticket.txt
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
      - if: always()
        run: |
          git config user.name "parlay-bot"; git config user.email "actions@github.com"
          cp ticket.txt /tmp/tk.txt
          for a in 1 2 3; do
            git fetch origin main; git reset --hard origin/main; cp /tmp/tk.txt ticket.txt
            git add ticket.txt
            git diff --cached --quiet && { echo unchanged; exit 0; }
            git commit -m "ticket price $(date -u '+%H:%M')"
            git push origin HEAD:main && exit 0
          done
          exit 1
