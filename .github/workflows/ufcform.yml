name: UFC fighter form
on:
  workflow_dispatch: {}
  push: { paths: ['experiments/UFCFORM.txt'] }
permissions: { contents: write }
concurrency: { group: parlay-ufcform, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          set -o pipefail
          python3 ufcform.py --selftest | tail -2
          python3 ufcform.py 2>&1 | tee ufcform.txt
      - if: always()
        run: |
          git config user.name  "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add ufcform.json ufcform.txt 2>/dev/null || git add ufcform.txt
          git diff --cached --quiet && exit 0
          for a in 1 2 3 4 5; do
            git commit -m "ufc fighter form $(date -u +%F)" || true
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase origin/main || git rebase --abort
          done
