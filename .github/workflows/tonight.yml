name: Tonight board
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ['experiments/TONIGHT.txt'] }
permissions: { contents: write }
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tonight.py --selftest
      - run: python3 tonight.py 12 2>&1 | tee tonight.txt
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
      - if: always()
        run: |
          git config user.name "parlay-bot"; git config user.email "actions@github.com"
          cp tonight.txt /tmp/tn.txt
          for a in 1 2 3; do
            git fetch origin main; git reset --hard origin/main; cp /tmp/tn.txt tonight.txt
            git add tonight.txt
            git diff --cached --quiet && { echo unchanged; exit 0; }
            git commit -m "tonight board $(date -u '+%H:%M')"
            git push origin HEAD:main && exit 0
          done
          exit 1
